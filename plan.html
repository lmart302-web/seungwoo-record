<!DOCTYPE html>
<html lang="ko">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>이번 달 계획</title>

<link rel="stylesheet" href="style.css">

<style>
  /* 1. 카드가 모바일 화면 좌우 꽉 차도록 외부 여백 최소화 */
  .section {
    padding: 6px !important; /* 카드 내부 상하좌우 여백을 6px로 극소화 */
    margin: 0 auto !important;
    width: 100% !important;
    box-sizing: border-box !important;
  }

  /* 2. 계획서 이미지를 카드 안에서 최대 크기로 확대 */
  .plan-image {
    width: 100% !important;
    max-width: 100% !important;
    height: auto !important;
    display: block !important; /* 이미지 하단 미세 여백 제거 */
    margin: 0 auto !important;
    border-radius: 10px; /* 미세한 둥근 모서리 유지 */
  }
</style>

</head>

<body>

<nav>

<a href="index.html">🏠 홈</a>
<a href="calendar.html">📅 달력</a>
<a href="weight.html">⚖️ 체중</a>
<a href="report.html">📊 월간리포트</a>

</nav>

<h1 id="planTitle">
📅 이번 달 계획
</h1>

<div class="section">

<img src="images/2026-09-plan.png" class="plan-image">

</div>

<script>
    const image = document.querySelector(".plan-image");
    const title = document.getElementById("planTitle");

    const fileName = image.src.split("/").pop();

    const match = fileName.match(/^(\d{4})-(\d{2})-plan\.png$/);

    if (match) {
        const year = match[1];
        const month = Number(match[2]);

        title.textContent = `📅 ${year}년 ${month}월`;
    }
</script>

</body>

</html>
