<!DOCTYPE html>
<html lang="ko">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>기록 입력</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<nav>

<a href="index.html">🏠 홈</a>

</nav>



<div class="input-page">


<h1>📝 오늘 기록 입력</h1>





<div class="section">


<h2>📅 날짜</h2>


<input id="recordDate" type="date">


</div>







<div class="section">


<h2>☀️ 오전 일과</h2>


<textarea 
id="morning"
placeholder="오전 활동을 입력하세요">
</textarea>


</div>







<div class="section">


<h2>🍚 점심</h2>


<input 
id="lunch"
type="text"
placeholder="먹은 메뉴 입력"
>


</div>







<div class="section">


<h2>🌙 오후 일과</h2>


<textarea 
id="afternoon"
placeholder="오후 활동을 입력하세요">
</textarea>


</div>







<div class="section">


<h2>🏃 운동</h2>


<p>런닝머신 이용 시간</p>


<input
id="running"
type="number"
placeholder="분"
>


</div>







<div class="section">


<h2>⚖️ 체중</h2>


<input
id="weight"
type="number"
step="0.1"
placeholder="kg"
>


</div>





<div class="section">

    </button>

</div>


</div>-->







<div class="section">


<button id="saveButton" class="save">

💾 기록 저장

</button>


</div>





</div>







<script type="module" src="input.js"></script>


</body>

</html>
