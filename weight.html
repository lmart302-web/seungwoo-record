<h1>⚖️ 체중 변화</h1>



<!-- 월간 / 연간 선택 -->

<div class="view-tabs">

    <button id="monthlyBtn" class="view-tab active">
        📅 월간
    </button>

    <button id="yearlyBtn" class="view-tab">
        📊 연간
    </button>

</div>



<!-- 월간 -->

<div id="monthlyView">


    <div class="section">

        <div class="calendar-header">

            <button id="prevMonth">
                ◀ 이전
            </button>

            <h2 id="monthTitle"></h2>

            <button id="nextMonth">
                다음 ▶
            </button>

        </div>


        <canvas id="weightChart"></canvas>


    </div>



    <div class="section">

        <h2>📋 체중 기록</h2>

        <ul id="weightList"></ul>

    </div>


</div>



<!-- 연간 -->

<div id="yearlyView" style="display:none;">


    <div class="section">

        <div class="calendar-header">

            <button id="prevYear">
                ◀ 이전
            </button>

            <h2 id="yearTitle"></h2>

            <button id="nextYear">
                다음 ▶
            </button>

        </div>


        <canvas id="yearWeightChart"></canvas>


    </div>


</div>



<script type="module" src="weight.js"></script>


</body>

</html>
