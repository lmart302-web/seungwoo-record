<!DOCTYPE html>
<html lang="ko">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>오늘 행동 상태</title>

<link rel="stylesheet" href="style.css">

<!-- 모바일 최적화 황금 비율 인라인 스타일 -->
<style>
  /* 모바일 화면 전체 레이아웃 */
  body.input-page {
    max-width: 480px !important;
    margin: 0 auto !important;
    padding: 16px 16px 40px !important;
    background-color: #fafaf7 !important;
    -webkit-tap-highlight-color: transparent;
  }

  body.input-page h1 {
    text-align: center !important;
    color: #4a4a4a !important;
    font-size: 1.35rem !important;
    font-weight: 700 !important;
    margin: 16px 0 20px !important;
    word-break: keep-all !important;
  }

  /* 1번 메인 카드 (부드러운 크림 버터 노랑) */
  body.input-page .section {
    background: #ffffff !important;
    border-radius: 18px !important;
    padding: 20px 18px !important;
    border: 2px solid #fef3c7 !important;
    box-shadow: 0 4px 10px rgba(0, 0, 0, 0.02) !important;
    display: flex !important;
    flex-direction: column !important;
    gap: 14px !important;
    margin-bottom: 16px !important;
  }

  /* 입력 영역 */
  body.input-page .record-row {
    display: flex !important;
    flex-direction: column !important;
    gap: 12px !important;
  }

  /* 딱 적당한 비율의 날짜 & 행동선택 입력창 (52px) */
  body.input-page input[type="date"],
  body.input-page select {
    width: 100% !important;
    height: 52px !important;
    min-height: 52px !important;
    max-height: 52px !important;
    line-height: 52px !important;
    box-sizing: border-box !important;
    border: 1.5px solid #fef08a !important;
    border-radius: 12px !important;
    padding: 0 16px !important;
    font-size: 16px !important;
    outline: none !important;
    background-color: #fffbeb !important;
    color: #4a4a4a !important;
    font-family: inherit !important;
    font-weight: 500 !important;
    appearance: none !important;
    -webkit-appearance: none !important;
    transition: all 0.2s ease;
  }

  body.input-page input[type="date"]:focus,
  body.input-page select:focus {
    background-color: #ffffff !important;
    border-color: #fde047 !important;
    box-shadow: 0 0 0 3px rgba(253, 224, 71, 0.2) !important;
  }

  /* 저장 버튼 (50px) */
  body.input-page .save {
    background: #fde047 !important;
    color: #713f12 !important;
    font-weight: bold !important;
    border: none !important;
    border-radius: 12px !important;
    height: 50px !important;
    min-height: 50px !important;
    width: 100% !important;
    font-size: 1.05rem !important;
    cursor: pointer !important;
    box-shadow: 0 3px 0px #eab308 !important;
    transition: all 0.1s ease;
    margin-top: 4px !important;
    display: flex !important;
    align-items: center !important;
    justify-content: center !important;
  }

  body.input-page .save:active {
    transform: translateY(2px) !important;
    box-shadow: 0 1px 0px #eab308 !important;
  }

  /* 2번 행동 게시판 카드 (포근한 크림 초록) */
  body.input-page .board-section {
    background: #ffffff !important;
    border-radius: 18px !important;
    padding: 16px 18px !important;
    border: 2px solid #dcfce7 !important;
    box-shadow: 0 4px 10px rgba(0, 0, 0, 0.02) !important;
  }

  /* 행동 게시판 링크 버튼 */
  body.input-page .difficult-link {
    display: flex !important;
    align-items: center !important;
    justify-content: center !important;
    height: 50px !important;
    min-height: 50px !important;
    background-color: #f0fdf4 !important;
    border: 1.5px solid #bbf7d0 !important;
    color: #166534 !important;
    font-weight: bold !important;
    text-decoration: none !important;
    border-radius: 12px !important;
    font-size: 0.98rem !important;
    box-shadow: 0 3px 0px #86efac !important;
    transition: all 0.1s ease;
  }

  body.input-page .difficult-link:active {
    transform: translateY(2px) !important;
    box-shadow: 0 1px 0px #86efac !important;
  }
</style>

</head>

<body class="input-page">

<nav>

<a href="index.html">🏠 홈</a>
<a href="calendar.html">📅 달력</a>
<a href="weight.html">⚖️ 체중</a>
<a href="report.html">📊 월간리포트</a>

</nav>


<h1>
😊 오늘 행동 상태
</h1>


<!-- 1번 네모 카드 -->
<div class="section">

<div class="record-row">

<input type="date" id="date">


<select id="behavior">

<option value="good">🟢 안정</option>

<option value="normal">🟡 보통</option>

<option value="hard">🔴 어려움</option>

<option value="holiday">🚫 휴강</option>

<option value="delete">🗑 기록 삭제</option>

</select>


<button
class="save"
id="saveBtn">

💾 저장하기

</button>

</div>

</div>


<!-- 2번 네모 카드 -->
<div class="board-section">

    <a href="difficult/difficult.html" class="difficult-link">
        📋 행동 게시판 바로가기
    </a>

</div>

</body>

</html>
