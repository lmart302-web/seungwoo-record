<!DOCTYPE html>
<html lang="ko">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>행동 기록 수정</title>

<link rel="stylesheet" href="../style.css">

</head>


<body>


<nav>

<a href="../index.html">🏠 홈</a>

</nav>




<div class="input-page">



<h1>✏️ 행동 기록 수정</h1>







<div class="section">


<h2>📅 날짜</h2>


<input 
id="recordDate" 
type="date"
>


</div>







<div class="section">


<h2>상태</h2>



<div class="behavior-buttons">


<button
type="button"
class="behavior-btn"
data-value="normal">

🟡 보통

</button>


<button
type="button"
class="behavior-btn"
data-value="hard">

🔴 어려움

</button>


<button
type="button"
class="behavior-btn"
data-value="other">

🥶 기타

</button>

<button
type="button"
class="behavior-btn"
data-value="home">

🏠 가정

</button>


</div>


</div>








<div class="section">


<h2>📝 행동 내용</h2>


<textarea
id="content">
</textarea>


</div>







<div class="section">


<button
id="updateButton"
class="save">

💾 수정 저장

</button>


</div>







</div>






<script type="module" src="difficultEdit.js"></script>


</body>

</html>
