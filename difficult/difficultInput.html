<!DOCTYPE html>
<html lang="ko">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>행동 기록 작성</title>

<link rel="stylesheet" href="../style.css">

</head>


<body>


<nav>

<a href="../index.html">🏠 홈</a>

</nav>





<div class="input-page">



<h1>📋 행동 기록 작성</h1>







<div class="section">


<h2>📅 날짜</h2>


<input 
id="recordDate" 
type="date"
>


</div>








<div class="section">


<h2>상태</h2>



<div class="behavior-buttons">


<button
type="button"
class="behavior-btn selected"
data-value="normal">

🟡 보통

</button>



<button
type="button"
class="behavior-btn"
data-value="hard">

🔴 어려운 행동

</button>



<button
type="button"
class="behavior-btn"
data-value="other">

🔵 기타

</button>


</div>



</div>









<div class="section">


<h2>📝 행동 내용</h2>


<textarea
id="content"
placeholder="어려운 행동 내용을 입력하세요">
</textarea>


</div>







<div class="section">


<button 
id="saveButton"
class="save">

💾 저장

</button>


</div>






</div>






<script type="module" src="difficultInput.js"></script>


</body>

</html>
