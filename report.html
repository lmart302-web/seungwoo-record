<html lang="ko">

<head>

    <meta charset="UTF-8">

    <title>월간 리포트</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <nav>

        <a href="index.html">🏠 홈</a>
        <a href="calendar.html">📅 달력</a>
        <a href="weight.html">⚖️ 체중</a>

    <h1>📊 월간 리포트</h1>



    <div class="section report-month-bar">
    <div class="calendar-header">
        <button id="prevMonth">
            ◀ 이전
        </button>
        <h2 id="monthTitle"></h2>
        <button id="nextMonth">
            다음 ▶
        </button>
    </div>
</div>



    <div class="section">

        <div class="report-title">

            <h2>⚖️ 체중 변화</h2>

        </div>

        <p id="weightSummary">-</p>

    </div>

    <div class="section">

        <div class="report-title">

            <h2>🎯 행동 통계</h2>

        </div>

        <p class="behavior-summary">
            🟢 <span id="goodCount">0</span>일
            &nbsp;&nbsp;&nbsp;
            🟡 <span id="normalCount">0</span>일
            &nbsp;&nbsp;&nbsp;
            🔴 <span id="hardCount">0</span>일
        </p>

        <div id="behaviorMiniCalendar" class="mini-calendar"></div>

    </div>



    <div class="section">
        <div class="report-title">
            <h2>🍱 점심 메뉴 TOP 1</h2>
        </div>
        <div id="topLunch">기록 없음</div>
    </div>



    <script type="module" src="report.js"></script>
